<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 46px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 25px Arial, sans-serif; fill: #334155; }
      .panel-title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 24px Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 20px Arial, sans-serif; fill: #334155; }
      .mono { font: 600 22px "SFMono-Regular", Menlo, Consolas, monospace; fill: #0f172a; }
      .mono-small { font: 600 18px "SFMono-Regular", Menlo, Consolas, monospace; fill: #0f172a; }
      .note { font: 700 21px Arial, sans-serif; fill: #7c2d12; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .lane-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 14; }
      .lane-green { fill: #f0fdf4; stroke: #86efac; stroke-width: 2; rx: 14; }
      .matrix-blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; rx: 10; }
      .matrix-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; rx: 10; }
      .matrix-gray { fill: #f1f5f9; stroke: #64748b; stroke-width: 3; rx: 10; }
      .weight { fill: #fffbeb; stroke: #f59e0b; stroke-width: 4; rx: 10; }
      .sum { fill: #fff7ed; stroke: #ea580c; stroke-width: 4; rx: 16; }
      .dash { stroke-dasharray: 10 8; }
      .arrow-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #16a34a; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .arrow-gray { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1280"/>
  <text x="70" y="70" class="title">Tensor Parallel Linear Shapes</text>
  <text x="70" y="112" class="subtitle">PyTorch Linear weight shape is [out_features, in_features]; linear(x, weight) computes x @ weight.T</text>

  <rect x="55" y="155" width="1690" height="495" class="panel"/>
  <text x="85" y="205" class="panel-title">ColumnParallelLinear: split output dimension</text>
  <text x="85" y="240" class="small">world_size = 2, every rank receives the same x and owns different output rows of weight</text>

  <rect x="90" y="310" width="245" height="100" class="matrix-gray"/>
  <text x="122" y="353" class="label">input</text>
  <text x="122" y="385" class="mono">x: [seq_len,</text>
  <text x="122" y="413" class="mono">in_features]</text>

  <rect x="410" y="270" width="450" height="295" class="lane-blue"/>
  <text x="435" y="310" class="label">Rank 0</text>
  <rect x="455" y="335" width="360" height="112" class="weight"/>
  <text x="482" y="374" class="mono-small">weight_0:</text>
  <text x="482" y="404" class="mono-small">[out_features / world_size,</text>
  <text x="482" y="432" class="mono-small"> in_features]</text>
  <text x="455" y="482" class="mono-small">y_0 = linear(x, weight_0)</text>
  <text x="455" y="513" class="mono-small">    = x @ weight_0.T</text>
  <rect x="510" y="520" width="270" height="58" class="matrix-blue"/>
  <text x="535" y="556" class="mono-small">[seq_len, out/world]</text>

  <rect x="900" y="270" width="450" height="295" class="lane-blue"/>
  <text x="925" y="310" class="label">Rank 1</text>
  <rect x="945" y="335" width="360" height="112" class="weight"/>
  <text x="972" y="374" class="mono-small">weight_1:</text>
  <text x="972" y="404" class="mono-small">[out_features / world_size,</text>
  <text x="972" y="432" class="mono-small"> in_features]</text>
  <text x="945" y="482" class="mono-small">y_1 = linear(x, weight_1)</text>
  <text x="945" y="513" class="mono-small">    = x @ weight_1.T</text>
  <rect x="1000" y="520" width="270" height="58" class="matrix-blue"/>
  <text x="1025" y="556" class="mono-small">[seq_len, out/world]</text>

  <path d="M335 360 C365 360, 375 380, 405 380" class="arrow-blue"/>
  <path d="M335 360 C705 235, 835 380, 895 380" class="arrow-blue"/>
  <path d="M780 548 C850 548, 890 548, 995 548" class="arrow-blue dash"/>

  <rect x="1430" y="340" width="230" height="130" class="matrix-blue"/>
  <text x="1460" y="382" class="label">logical full y</text>
  <text x="1460" y="415" class="mono-small">concat(y_0, y_1)</text>
  <text x="1460" y="445" class="mono-small">[seq_len, out]</text>
  <path d="M1270 548 C1360 548, 1375 420, 1425 410" class="arrow-blue dash"/>
  <text x="1435" y="520" class="note">no all_reduce</text>

  <rect x="55" y="705" width="1690" height="505" class="panel"/>
  <text x="85" y="755" class="panel-title">RowParallelLinear: split input dimension</text>
  <text x="85" y="790" class="small">each rank receives one input shard, computes a partial full-width output, then all_reduce sums them</text>

  <rect x="90" y="850" width="295" height="82" class="matrix-gray"/>
  <text x="118" y="884" class="mono-small">x_0: [seq_len,</text>
  <text x="118" y="914" class="mono-small">in_features / world_size]</text>
  <rect x="90" y="1012" width="295" height="82" class="matrix-gray"/>
  <text x="118" y="1046" class="mono-small">x_1: [seq_len,</text>
  <text x="118" y="1076" class="mono-small">in_features / world_size]</text>

  <rect x="460" y="815" width="430" height="180" class="lane-green"/>
  <text x="485" y="855" class="label">Rank 0</text>
  <rect x="500" y="875" width="350" height="90" class="weight"/>
  <text x="525" y="906" class="mono-small">weight_0:</text>
  <text x="525" y="934" class="mono-small">[out_features,</text>
  <text x="525" y="959" class="mono-small"> in_features / world_size]</text>
  <text x="500" y="985" class="mono-small">partial_0 = x_0 @ weight_0.T</text>

  <rect x="460" y="1000" width="430" height="180" class="lane-green"/>
  <text x="485" y="1040" class="label">Rank 1</text>
  <rect x="500" y="1060" width="350" height="90" class="weight"/>
  <text x="525" y="1091" class="mono-small">weight_1:</text>
  <text x="525" y="1119" class="mono-small">[out_features,</text>
  <text x="525" y="1144" class="mono-small"> in_features / world_size]</text>
  <text x="500" y="1170" class="mono-small">partial_1 = x_1 @ weight_1.T</text>

  <rect x="990" y="855" width="270" height="76" class="matrix-green"/>
  <text x="1018" y="887" class="mono-small">partial_0:</text>
  <text x="1018" y="916" class="mono-small">[seq_len, out]</text>
  <rect x="990" y="1045" width="270" height="76" class="matrix-green"/>
  <text x="1018" y="1077" class="mono-small">partial_1:</text>
  <text x="1018" y="1106" class="mono-small">[seq_len, out]</text>

  <rect x="1355" y="944" width="230" height="110" class="sum"/>
  <text x="1392" y="990" class="label">all_reduce</text>
  <text x="1408" y="1022" class="mono-small">sum</text>

  <rect x="1625" y="955" width="85" height="88" class="matrix-green"/>
  <text x="1655" y="990" class="mono-small">y</text>
  <text x="1535" y="1078" class="mono-small">[seq_len, out_features]</text>
  <text x="1342" y="1104" class="note">bias added after all_reduce</text>

  <path d="M385 891 C420 891, 420 925, 455 925" class="arrow-green"/>
  <path d="M385 1053 C420 1053, 420 1110, 455 1110" class="arrow-green"/>
  <path d="M890 925 C935 925, 945 893, 985 893" class="arrow-green"/>
  <path d="M890 1110 C935 1110, 945 1083, 985 1083" class="arrow-green"/>
  <path d="M1260 893 C1305 893, 1320 972, 1350 985" class="arrow-green"/>
  <path d="M1260 1083 C1305 1083, 1320 1025, 1350 1015" class="arrow-green"/>
  <path d="M1585 999 C1605 999, 1612 999, 1635 999" class="arrow-green"/>

  <text x="85" y="1250" class="small">Short memory: Column splits output rows of weight; Row splits input columns of weight.</text>
</svg>
